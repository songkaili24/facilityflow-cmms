<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — FacilityFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #1e293b;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        color: #475569;
        line-height: 1.6;
        margin: 0;
      }
      .tag {
        display: inline-block;
        background: #f97316;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 0.75rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
      }
      code {
        background: #e2e8f0;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">OFFLINE MODE</span>
      <h1>You're off the network</h1>
      <p>
        This page isn't cached yet, but your forms and photos queue locally and sync when the
        connection returns — open work orders you've visited recently are available offline.
      </p>
      <p style="margin-top: 1rem"><code>Retry once Wi-Fi or LTE is back</code></p>
    </main>
  </body>
</html>
